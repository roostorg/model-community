name: Discord Bot

on:
  issues:
    types: [opened]
  # Needed so the workflow running on fork PRs can use the webhook secret.
  # Safe as long as no code from the pull request is checked out or executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, ready_for_review]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: roostorg/discord-bot@308d8cce31f854d50182558bf29851f01e493acf # main
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
